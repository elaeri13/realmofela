.qj-tab:hover:not(.qj-tab-active) { background:rgba(245,158,11,.08); color:#EDE9FE; }
.qj-body { display:flex; flex-direction:column; gap:10px; flex:1; overflow-y:auto; min-height:0; }
.sq-hub-card { background:rgba(245,158,11,.1); border:1.5px solid rgba(245,158,11,.45); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:6px; }
.sq-done-card { background:rgba(100,116,139,.08); border-color:rgba(100,116,139,.25); opacity:.8; }
.sq-hub-type { font-size:10px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; color:#B45309; }
.sq-hub-name { font-size:14px; font-weight:900; color:#1a0533; }
.sq-hub-desc { font-size:12px; color:#4a3060; line-height:1.4; }
.sq-hub-footer { display:flex; align-items:center; justify-content:space-between; margin-top:4px; }
.sq-hub-xp { font-size:12px; font-weight:700; color:#FDE68A; }
.sq-done-badge { font-size:11px; font-weight:700; color:#6EE7B7; }
.sq-empty { font-size:12px; color:#64748B; font-style:italic; text-align:center; padding:12px 0; }
.btn-sq-complete { background:#F59E0B; color:#1E1B4B; border:none; border-radius:8px; padding:6px 14px; font-size:12px; font-weight:800; cursor:pointer; font-family:inherit; }
.btn-sq-complete:hover { background:#D97706; }
.sq-view-lesson-btn { background:rgba(167,139,250,.15); color:#C4B5FD; border:1px solid rgba(167,139,250,.35); border-radius:8px; padding:5px 10px; font-size:11px; font-weight:700; cursor:pointer; font-family:inherit; }
.sq-view-lesson-btn:hover { background:rgba(167,139,250,.3); }
/* Lesson Lore — parchment block */
.ls-lore { margin:0; }
.ls-lore-inner { background:rgba(0,0,0,.06); border-left:3px solid #F5C842; border-radius:0 10px 10px 0; padding:12px 14px; display:flex; gap:10px; align-items:flex-start; }
.ls-lore-icon { flex-shrink:0; margin-top:1px; }
.ls-lore-text { margin:0; font-size:13px; line-height:1.65; color:#1A1A1A; font-style:italic; letter-spacing:.2px; }
/* Equipment panel */
/* Weapon slot next to avatar portrait */
.weapon-slot { position:absolute; bottom:6px; right:-14px; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; z-index:5; transition:transform .15s,box-shadow .15s; }
.weapon-slot-equipped { background:rgba(251,191,36,.2); border:2px solid #FBBF24; box-shadow:0 0 10px rgba(251,191,36,.5); cursor:pointer; }
.weapon-slot-equipped:hover { transform:scale(1.12); box-shadow:0 0 16px rgba(251,191,36,.7); }
.weapon-slot-available { background:rgba(255,255,255,.06); border:2px dashed rgba(251,191,36,.4); cursor:pointer; }
.weapon-slot-available:hover { background:rgba(251,191,36,.1); border-color:#FBBF24; }
.weapon-slot-empty { background:rgba(255,255,255,.04); border:2px dashed rgba(255,255,255,.1); pointer-events:none; }
.weapon-slot-icon { font-size:20px; line-height:1; }
.weapon-slot-empty-icon { opacity:.35; font-size:16px; }
/* Equipped item glow in inventory */
.item-equipped { border-color:#FBBF24 !important; background:rgba(251,191,36,.12) !important; box-shadow:0 0 8px rgba(251,191,36,.3); }
.item-equip-lbl { display:block; font-size:9px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; margin-top:2px; }
.item-equipped .item-equip-lbl { color:#FBBF24; }
.item-slot:not(.item-equipped) .item-equip-lbl { color:#6B7280; }
/* Make equippable items cursor:pointer */
[data-equip-item] { cursor:pointer; }
[data-equip-item]:hover { border-color:#FBBF24 !important; background:rgba(251,191,36,.1); }
/* Equipment items in inventory grid */
.item-equip-new { cursor:pointer; border-width:2px; }
.item-equip-new:hover { transform:translateY(-2px); box-shadow:0 4px 14px color-mix(in srgb,var(--tier-color) 35%,transparent); }
.item-equip-new .item-name { color:var(--tier-color) !important; }
.item-equip-new.item-equipped { border-color:var(--tier-color) !important; background:color-mix(in srgb,var(--tier-color) 10%,white) !important; box-shadow:0 0 8px color-mix(in srgb,var(--tier-color) 40%,transparent); }
/* Ghost preview image on empty equip slots */
.equip-slot-ghost { position:absolute; inset:0; width:100% !important; height:100% !important; object-fit:contain; opacity:0.18; pointer-events:none; }
/* Equip slot owned-count badge */
.equip-slot-owned-badge { position:absolute; top:5px; right:5px; background:#7C3AED; color:#fff; font-size:9px; font-weight:900; border-radius:10px; padding:1px 5px; min-width:16px; text-align:center; line-height:16px; z-index:2; pointer-events:none; }
/* Equip picker modals (weapon / shield / collectibles) */
.equip-picker-overlay { position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:300; display:flex; align-items:center; justify-content:center; padding:16px; }
.equip-picker-box { background:#fff; border-radius:16px; padding:24px 20px 20px; max-width:420px; width:100%; max-height:80vh; display:flex; flex-direction:column; gap:16px; box-shadow:0 8px 40px rgba(0,0,0,.28); }
.equip-picker-title { font-family:var(--font-display); font-size:18px; font-weight:800; color:var(--purple-dark); text-align:center; }
.equip-picker-list { display:flex; flex-direction:column; gap:10px; overflow-y:auto; }
.equip-picker-item { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; border:1.5px solid color-mix(in srgb,var(--tier-color,#9CA3AF) 40%,transparent); background:color-mix(in srgb,var(--tier-color,#9CA3AF) 6%,white); cursor:pointer; transition:background .15s; }
.equip-picker-item:hover { background:color-mix(in srgb,var(--tier-color,#9CA3AF) 14%,white); }
.equip-picker-item-eq { border-color:var(--tier-color); background:color-mix(in srgb,var(--tier-color) 12%,white); }
.equip-picker-img { width:64px; height:64px; object-fit:contain; flex-shrink:0; }
.equip-picker-info { flex:1; display:flex; flex-direction:column; gap:2px; }
.equip-picker-name { font-size:13px; font-weight:700; }
.equip-picker-tier { font-size:11px; color:#6B7280; text-transform:capitalize; }
.equip-picker-btn { padding:6px 14px; border-radius:8px; border:1.5px solid var(--tier-color,#9CA3AF); background:transparent; color:var(--tier-color,#374151); font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; }
.equip-picker-btn:hover { background:var(--tier-color,#9CA3AF); color:#fff; }
.equip-picker-btn-eq { background:var(--tier-color); color:#fff; }
.equip-picker-empty { text-align:center; color:#9CA3AF; padding:20px 0; font-size:14px; }
/* Collectibles count badge inside picker */
.collectibles-count-badge { background:#F59E0B; color:#fff; font-size:11px; font-weight:900; border-radius:10px; padding:2px 8px; white-space:nowrap; flex-shrink:0; }
/* Collectibles modal tabs */
.coll-tabs { display:flex; gap:6px; border-bottom:1.5px solid #EDE9FE; padding-bottom:10px; margin-bottom:10px; }
.coll-tab { flex:1; padding:7px 0; border-radius:8px; border:1.5px solid #EDE9FE; background:transparent; font-size:12px; font-weight:700; color:#6B7280; cursor:pointer; transition:background .12s,color .12s; }
.coll-tab:hover { background:#F5F3FF; color:#7C3AED; }
.coll-tab.coll-tab-active { background:#7C3AED; color:#fff; border-color:#7C3AED; }
/* Seasonal badge grid */
.seasonal-badge-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.seasonal-badge-slot { display:flex; flex-direction:column; align-items:center; gap:5px; padding:10px 6px 8px; border-radius:12px; background:rgba(124,58,237,.06); border:1.5px solid rgba(124,58,237,.18); text-align:center; }
.seasonal-badge-locked { opacity:.28; filter:grayscale(1); }
.seasonal-badge-ph { width:52px; height:52px; display:flex; align-items:center; justify-content:center; font-size:28px; background:rgba(0,0,0,.06); border-radius:8px; }
.seasonal-badge-name { font-size:9px; font-weight:700; color:#4B5563; line-height:1.2; }
/* Collectibles modal sections */
.coll-section { margin-bottom:18px; }
.coll-section-active { border-left:3px solid #7C3AED; padding-left:10px; }
.coll-section-hdr { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
.coll-section-land { font-size:12px; font-weight:800; color:#374151; }
.coll-section-season { font-size:12px; font-weight:800; color:#374151; }
.coll-season-active { font-size:10px; font-weight:800; color:#7C3AED; background:rgba(124,58,237,.1); border-radius:6px; padding:1px 6px; }
.coll-season-status { font-size:10px; font-weight:600; color:#9CA3AF; }
.coll-season-past { opacity:.6; }
.coll-season-count { font-size:10px; font-weight:600; color:#9CA3AF; margin-left:auto; }
.coll-item-slot { display:flex; flex-direction:column; align-items:center; gap:5px; padding:10px 6px 8px; border-radius:12px; background:rgba(124,58,237,.06); border:1.5px solid rgba(124,58,237,.18); text-align:center; }
.coll-item-locked { opacity:.28; filter:grayscale(1); }
/* Special badges */
.special-badge-slot { display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 10px 12px; border-radius:14px; background:rgba(245,158,11,.06); border:1.5px solid rgba(245,158,11,.22); text-align:center; }
.special-badge-emoji { font-size:36px; line-height:1; }
.special-badge-desc { font-size:9px; font-weight:500; color:#9CA3AF; line-height:1.3; }
/* Cosmetics tab */
.cosm-subtabs { display:flex; gap:8px; margin-bottom:14px; }
.cosm-subtab { flex:1; padding:7px 0; border-radius:8px; border:1.5px solid #EDE9FE; background:transparent; font-size:12px; font-weight:700; color:#6B7280; cursor:pointer; transition:background .12s,color .12s; }
.cosm-subtab:hover { background:#F5F3FF; color:#7C3AED; }
.cosm-subtab.cosm-subtab-active { background:#7C3AED; color:#fff; border-color:#7C3AED; }
.cosm-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.cosm-slot { display:flex; flex-direction:column; align-items:center; gap:5px; padding:10px 6px 10px; border-radius:12px; background:rgba(124,58,237,.05); border:1.5px solid rgba(124,58,237,.15); text-align:center; cursor:pointer; transition:border-color .15s,background .15s; position:relative; }
.cosm-slot:not(.cosm-locked):hover { background:rgba(124,58,237,.12); border-color:#7C3AED; }
.cosm-slot.cosm-locked { opacity:.38; cursor:default; filter:grayscale(.7); }
.cosm-slot.cosm-equipped { border-color:#7C3AED; background:rgba(124,58,237,.12); box-shadow:0 0 0 2px rgba(124,58,237,.3); }
.cosm-img-wrap { position:relative; width:64px; height:64px; }
.cosm-check { position:absolute; top:-4px; right:-4px; width:18px; height:18px; border-radius:50%; background:#7C3AED; color:#fff; font-size:10px; font-weight:900; display:flex; align-items:center; justify-content:center; }
.cosm-name { font-size:9px; font-weight:700; color:#374151; line-height:1.3; }
.cosm-action { font-size:9px; font-weight:800; color:#7C3AED; text-transform:uppercase; letter-spacing:.4px; }
.cosm-locked-lbl { font-size:9px; font-weight:700; color:#9CA3AF; text-transform:uppercase; letter-spacing:.4px; }
.cosm-revert-btn { display:block; width:100%; padding:10px 0; border-radius:10px; background:rgba(239,68,68,.1); border:1.5px solid #EF4444; color:#DC2626; font-size:13px; font-weight:800; cursor:pointer; margin-bottom:14px; transition:background .15s; }
.cosm-revert-btn:hover { background:rgba(239,68,68,.2); }
/* Frame overlay on avatar */
.avatar-frame-overlay { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; pointer-events:none; z-index:2; }
.avatar-hub-frame-wrap { position:relative; width:250px; height:250px; overflow:hidden; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
/* ── Writing Transport ── */
.wt-screen { position:fixed; inset:0; z-index:8000; background:#0a0517; display:flex; align-items:center; justify-content:center; flex-direction:column; }
.wt-inkblast { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
@keyframes wt-swirl { 0% { transform:scale(0) rotate(0deg); opacity:0; } 40% { opacity:.8; } 100% { transform:scale(60) rotate(720deg); opacity:0; } }
.wt-title-card { position:relative; z-index:2; text-align:center; animation:wt-fade-in 1s ease .8s both; }
.wt-title-card h1 { font-family:var(--font-display); font-size:clamp(28px,6vw,52px); color:#F5E090; text-shadow:0 0 40px rgba(245,224,144,.6); margin:0; }
.wt-title-card p { color:rgba(255,255,255,.55); font-size:16px; margin-top:12px; }
@keyframes wt-fade-in { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:none; } }
/* ── Boss / Scribe intro popup ── */
.boss-intro-overlay { position:fixed; inset:0; z-index:8500; display:flex; align-items:center; justify-content:center; background:rgba(10,5,30,.82); backdrop-filter:blur(6px); }
.boss-intro-card { background:linear-gradient(160deg,#1e103a 0%,#0d1f3c 100%); border:2px solid rgba(168,139,250,.45); border-radius:20px; padding:32px 28px; max-width:420px; width:90%; text-align:center; animation:mystery-card-pop .35s cubic-bezier(.34,1.56,.64,1); }
.boss-intro-eyebrow { font-size:11px; font-weight:800; letter-spacing:2px; color:rgba(168,139,250,.7); text-transform:uppercase; margin-bottom:12px; }
.boss-intro-portrait { width:120px; height:120px; object-fit:contain; margin:0 auto 12px; display:block; border-radius:50%; }
.boss-intro-name { font-family:var(--font-display); font-size:24px; font-weight:900; color:#fff; margin-bottom:8px; }
.boss-intro-text { font-size:14px; color:rgba(255,255,255,.75); line-height:1.6; margin-bottom:20px; font-style:italic; }
.boss-intro-btn { background:linear-gradient(135deg,#7C3AED,#5B21B6); color:#fff; border:none; border-radius:12px; padding:12px 28px; font-size:14px; font-weight:700; cursor:pointer; transition:background .2s; }
.boss-intro-btn:hover { background:linear-gradient(135deg,#8B5CF6,#6D28D9); }
/* Full-bleed boss encounter card */
.boss-encounter-card { border:2px solid rgba(168,139,250,.45); border-radius:20px; max-width:420px; width:90%; overflow:hidden; display:flex; flex-direction:column; justify-content:space-between; min-height:480px; background-size:cover; background-position:center top; background-color:#0d1020; animation:mystery-card-pop .35s cubic-bezier(.34,1.56,.64,1); }
.boss-encounter-card-fallback { background:linear-gradient(160deg,#1e103a 0%,#0d1f3c 100%); }
.bec-eyebrow-bar { background:linear-gradient(to bottom,rgba(8,3,25,.82) 0%,rgba(8,3,25,.45) 55%,transparent 100%); padding:20px 24px 48px; text-align:center; }
.bec-content { background:linear-gradient(to top,rgba(4,0,16,.94) 0%,rgba(4,0,16,.78) 45%,rgba(4,0,16,.3) 75%,transparent 100%); padding:40px 28px 28px; text-align:center; }
.bec-fallback-icon { font-size:52px; margin-bottom:12px; }
/* ── Boss submitted / holding state ── */
.boss-holding-card { background:rgba(168,139,250,.08); border:2px solid rgba(168,139,250,.2); border-radius:16px; padding:20px 24px; margin:16px 0; text-align:center; }
@keyframes spin { to { transform:rotate(360deg); } }
.boss-holding-spinner { width:36px; height:36px; border:3px solid rgba(168,139,250,.2); border-top-color:#A78BFA; border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 10px; }
.boss-holding-label { font-size:11px; font-weight:800; letter-spacing:2px; text-transform:uppercase; color:rgba(168,139,250,.6); margin-bottom:8px; }
.boss-holding-text { font-size:14px; color:rgba(255,255,255,.7); line-height:1.6; font-style:italic; }
/* ── Scribe approval ── */
.scribe-approved-banner { font-family:var(--font-display); font-size:22px; font-weight:900; color:#34D399; text-align:center; margin:6px 0; }
.scribe-approved-glow { color:#34D399; filter:drop-shadow(0 0 20px rgba(52,211,153,.5)); font-size:44px; display:block; text-align:center; margin-bottom:4px; }
/* ── Writing submitted state ── */
.we-submitted-card { background:rgba(168,139,250,.08); border:2px solid rgba(168,139,250,.2); border-radius:16px; padding:20px 24px; margin:16px 0; text-align:center; }
.we-submitted-icon { font-size:36px; display:block; margin-bottom:10px; }
.we-submitted-title { font-family:var(--font-display); font-size:18px; color:#A78BFA; margin-bottom:8px; }
.we-submitted-body { font-size:14px; color:rgba(255,255,255,.7); line-height:1.6; font-style:italic; }
/* ── Sanctum return popup ── */
.sanctum-return-overlay { position:fixed; inset:0; z-index:8500; display:flex; align-items:center; justify-content:center; background:rgba(10,5,30,.80); backdrop-filter:blur(6px); }
.sanctum-return-card { background:linear-gradient(160deg,#1e103a 0%,#0d1f3c 100%); border:2px solid rgba(245,158,11,.45); border-radius:20px; padding:28px; max-width:380px; width:90%; text-align:center; animation:mystery-card-pop .35s cubic-bezier(.34,1.56,.64,1); }
.sanctum-return-card h2 { font-family:var(--font-display); font-size:20px; color:#F59E0B; margin:0 0 12px; }
.sanctum-return-card p { font-size:14px; color:rgba(255,255,255,.75); line-height:1.6; margin-bottom:20px; font-style:italic; }
/* ── Scribe's Sanctum Map ── */
.sanctum-screen { position:relative; display:flex; flex-direction:column; overflow:hidden; background:#0a0517; }
.sanctum-bg { position:absolute; inset:0; background-size:cover; background-position:center; opacity:.85; pointer-events:none; }
.sanctum-nav { position:relative; z-index:2; display:flex; align-items:center; gap:16px; padding:12px 16px; background:linear-gradient(180deg,rgba(10,5,23,.85) 0%,transparent 100%); }
.sanctum-map-outer { position:relative; z-index:1; flex:1; display:flex; align-items:center; justify-content:center; overflow:visible; }
.sanctum-boss-portrait { position:absolute; bottom:-18%; left:50%; transform:translateX(-50%); height:75%; width:auto; z-index:0; pointer-events:none; opacity:.7; }
.sanctum-map-inner { position:relative; width:min(1200px,100vw); aspect-ratio:1200/680; }
.st-path-svg { position:absolute; inset:0; width:100%; height:100%; }
/* Sanctum tiles */
.st-tile { position:absolute; width:112px; text-align:center; transform:translate(-50%,-50%); cursor:default; }
.st-tile-click { cursor:pointer; }
.st-tile-img-wrap { position:relative; width:112px; height:112px; margin:0 auto; border-radius:12px; }
.st-tile-img-wrap img { width:112px; height:112px; object-fit:contain; display:block; transition:transform .2s; }
.st-tile-click:hover .st-tile-img-wrap img { transform:scale(1.08); }
.st-tile-label { font-size:11px; font-weight:700; color:rgba(245,224,144,.85); text-align:center; margin-top:6px; text-shadow:0 1px 6px rgba(0,0,0,.8); letter-spacing:.3px; }
/* Tile borders by state */
.st-tile-locked .st-tile-img-wrap {
  box-shadow: 0 0 0 2px rgba(100,90,60,.35), 0 0 0 5px rgba(130,115,75,.15), 0 0 0 6px rgba(80,70,45,.2);
}
.st-tile-locked .st-tile-img-wrap img { filter:grayscale(1) brightness(.4); }
.st-tile-locked .st-tile-label { color:rgba(255,255,255,.3); }
.st-tile-current .st-tile-img-wrap { animation:st-border-glow 1.6s ease-in-out infinite; }
@keyframes st-border-glow {
  0%,100% { box-shadow:0 0 0 2px #6B5010, 0 0 0 5px #C9A227, 0 0 0 7px #6B5010, 0 0 18px rgba(212,165,0,.45); }
  50%      { box-shadow:0 0 0 2px #9A7820, 0 0 0 6px #FFD700, 0 0 0 8px #7A6010, 0 0 30px rgba(255,215,0,.7); }
}
.st-tile-done .st-tile-img-wrap {
  box-shadow: 0 0 0 2px #5A4008, 0 0 0 5px #B8920A, 0 0 0 7px #5A4008, 0 0 14px rgba(184,146,10,.3), 0 0 20px rgba(5,150,105,.15);
}
.st-tile-done .st-tile-img-wrap img { filter:brightness(.8) saturate(.7); }
.st-tile-submitted .st-tile-img-wrap {
  box-shadow: 0 0 0 2px #5A2E00, 0 0 0 5px #D97706, 0 0 0 7px #5A2E00, 0 0 14px rgba(217,119,6,.3);
}
.st-tile-submitted .st-tile-img-wrap img { filter:sepia(.4) hue-rotate(20deg); }
/* Done badge */
.st-done-badge { position:absolute; top:-6px; right:-6px; width:24px; height:24px; border-radius:50%; background:#059669; color:#fff; font-size:13px; font-weight:900; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(5,150,105,.5); }
.st-done-badge-green { background:#059669; }
.st-done-badge-orange { background:#D97706; }
/* Current tile outer pulse ring */
.st-pulse { position:absolute; inset:-10px; border-radius:14px; border:2px solid rgba(245,224,144,.6); animation:st-ring-pulse 1.6s ease-in-out infinite; pointer-events:none; }
.st-pulse-gold { border-color:rgba(245,158,11,.7); }
@keyframes st-ring-pulse { 0%,100% { opacity:.85; transform:scale(1); } 50% { opacity:.2; transform:scale(1.06); } }
/* Status bar */
.sanctum-status-bar { position:relative; z-index:2; text-align:center; padding:10px 20px; font-size:13px; font-weight:700; }
.sb-wait { background:rgba(168,139,250,.15); color:rgba(200,180,255,.9); border-top:1px solid rgba(168,139,250,.2); }
.sb-ok   { background:rgba(52,211,153,.12);  color:rgba(100,230,180,.9); border-top:1px solid rgba(52,211,153,.25); }
.sb-rev  { background:rgba(245,158,11,.12);  color:rgba(250,200,80,.9);  border-top:1px solid rgba(245,158,11,.25); }
/* Sanctum checklist modal */
.st-checklist-card { background:linear-gradient(160deg,#1a0a3a 0%,#0d0420 100%); border:2px solid rgba(168,139,250,.35); border-radius:20px; padding:28px 32px; max-width:480px; width:92%; max-height:88vh; overflow-y:auto; text-align:center; animation:mystery-card-pop .35s cubic-bezier(.34,1.56,.64,1); }
.st-checklist { list-style:none; padding:0; margin:0 0 20px; display:flex; flex-direction:column; gap:10px; text-align:left; }
.st-check-item { }
.st-check-label { display:flex; align-items:flex-start; gap:10px; cursor:pointer; line-height:1.5; }
.st-checkbox { flex-shrink:0; width:18px; height:18px; margin-top:2px; accent-color:#a78bfa; cursor:pointer; }
.st-check-text { font-size:14px; color:rgba(220,210,255,.9); transition:color .2s,text-decoration-color .2s; }
.st-check-done { color:rgba(110,231,183,.85); text-decoration:line-through; text-decoration-color:rgba(110,231,183,.4); }
.boss-intro-btn:disabled { opacity:.4; cursor:not-allowed; }
/* Mystery Drop reveal overlay */
.mystery-reveal-overlay { position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; background:rgba(10,5,30,.75); backdrop-filter:blur(6px); animation:mystery-fade-in .3s ease; }
.mystery-reveal-overlay.mystery-reveal-out { animation:mystery-fade-out .35s ease forwards; }
@keyframes mystery-fade-in  { from { opacity:0; } to { opacity:1; } }
@keyframes mystery-fade-out { from { opacity:1; } to { opacity:0; } }
.mystery-reveal-card { background:linear-gradient(160deg,#1e103a 0%,#2a1555 60%,#0d0920 100%); border:2px solid rgba(167,139,250,.5); border-radius:20px; padding:28px 24px 24px; max-width:320px; width:90%; text-align:center; box-shadow:0 0 60px rgba(139,92,246,.35),0 20px 60px rgba(0,0,0,.6); animation:mystery-card-pop .35s cubic-bezier(.34,1.56,.64,1); }
@keyframes mystery-card-pop { from { transform:scale(.8) translateY(20px); opacity:0; } to { transform:scale(1) translateY(0); opacity:1; } }
.mystery-stars { font-size:18px; letter-spacing:4px; color:#A78BFA; margin-bottom:8px; animation:mystery-pulse 1.5s ease-in-out infinite; }
@keyframes mystery-pulse { 0%,100%{opacity:.7;} 50%{opacity:1;} }
.mystery-reveal-eyebrow { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:1.5px; color:#C4B5FD; margin-bottom:14px; }
.mystery-reveal-img-wrap { position:relative; width:120px; height:120px; margin:0 auto 14px; }
.mystery-reveal-img-wrap img { border-radius:12px; object-fit:contain; }
.mystery-reveal-glow { position:absolute; inset:-8px; border-radius:20px; background:radial-gradient(circle,rgba(139,92,246,.5) 0%,transparent 70%); z-index:-1; animation:mystery-glow-pulse 2s ease-in-out infinite; }
@keyframes mystery-glow-pulse { 0%,100%{opacity:.6;transform:scale(1);} 50%{opacity:1;transform:scale(1.08);} }
.mystery-reveal-name { font-size:20px; font-weight:900; color:#F5F3FF; font-family:var(--font-display,serif); margin-bottom:6px; }
.mystery-reveal-flavor { font-size:12px; font-style:italic; color:#A78BFA; margin-bottom:12px; line-height:1.5; }
.mystery-reveal-sub { font-size:11px; color:#7C6FA0; margin-bottom:16px; }
.mystery-reveal-btn { display:block; width:100%; padding:12px 0; border-radius:12px; background:linear-gradient(135deg,#7C3AED 0%,#5B21B6 100%); border:none; color:#fff; font-size:14px; font-weight:800; cursor:pointer; letter-spacing:.5px; box-shadow:0 4px 14px rgba(124,58,237,.5); transition:transform .1s,box-shadow .1s; }
.mystery-reveal-btn:hover { transform:translateY(-1px); box-shadow:0 6px 18px rgba(124,58,237,.6); }
.mystery-reveal-btn:active { transform:translateY(0); }
/* Health Potion — usable inventory slots */
.item-usable { cursor:pointer; position:relative; }
.item-usable:hover { border-color:#EF4444 !important; background:rgba(239,68,68,.12); transform:scale(1.05); }
.item-use-lbl { display:block; font-size:9px; font-weight:700; color:#EF4444; letter-spacing:.5px; text-transform:uppercase; margin-top:2px; }
/* Brew button */
.brew-row { margin-top:10px; display:flex; justify-content:center; }
.btn-brew { background:rgba(239,68,68,.15); border:1.5px solid #EF4444; color:#FCA5A5; border-radius:10px; padding:8px 16px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; transition:background .15s; width:100%; box-sizing:border-box; }
.btn-brew:hover { background:rgba(239,68,68,.28); }
.brew-pending { font-size:12px; color:#94A3B8; font-style:italic; text-align:center; }
/* HP flash animation */
@keyframes hpFlash { 0%,100%{background:transparent} 30%{background:rgba(239,68,68,.2)} }
.hp-flash { animation:hpFlash .7s ease; }
@keyframes hpFloat { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-40px)} }
.hp-floater { position:absolute; top:10px; right:16px; font-size:16px; font-weight:900; color:#EF4444; animation:hpFloat .9s ease forwards; pointer-events:none; z-index:50; }
/* Crafting station modal */
.crafting-overlay { position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:200; display:flex; align-items:center; justify-content:center; padding:16px; }
.crafting-modal { background:#1E1B2E; border:2px solid rgba(167,139,250,.35); border-radius:20px; padding:28px 24px 24px; width:100%; max-width:380px; max-height:90vh; overflow-y:auto; position:relative; }
.crafting-title { font-size:18px; font-weight:900; color:#EDE9FE; text-align:center; margin-bottom:4px; }
.crafting-subtitle { font-size:13px; color:#94A3B8; text-align:center; margin-bottom:20px; }
.crafting-close { position:absolute; top:12px; right:14px; background:none; border:none; color:#6B7280; font-size:18px; cursor:pointer; line-height:1; }
.crafting-close:hover { color:#EDE9FE; }
.crafting-back { position:absolute; top:12px; left:14px; background:none; border:none; color:#94A3B8; font-size:13px; cursor:pointer; font-family:inherit; }
.crafting-back:hover { color:#EDE9FE; }
.crafting-cards { display:flex; flex-direction:column; gap:12px; }
.crafting-card { background:rgba(255,255,255,.05); border:1.5px solid rgba(255,255,255,.1); border-radius:14px; padding:16px 18px; display:flex; align-items:center; gap:14px; cursor:pointer; transition:background .15s,border-color .15s; }
.crafting-card:hover { background:rgba(167,139,250,.15); border-color:rgba(167,139,250,.5); }
.crafting-card-icon { font-size:32px; flex-shrink:0; }
.crafting-card-img-wrap { flex-shrink:0; width:64px; height:64px; display:flex; align-items:center; justify-content:center; }
.crafting-card-img-wrap .item-img { width:64px; height:64px; object-fit:contain; }
.crafting-card-name { font-size:15px; font-weight:800; color:#EDE9FE; display:block; }
.crafting-card-desc { font-size:12px; color:#94A3B8; display:block; margin-top:2px; }
.crafting-selected-card { display:flex; flex-direction:column; align-items:center; gap:6px; padding:20px; background:rgba(167,139,250,.08); border-radius:14px; margin-bottom:20px; }
.crafting-checkbox-row { display:flex; align-items:flex-start; gap:10px; font-size:13px; color:#CBD5E1; line-height:1.5; margin-bottom:18px; cursor:pointer; }
.crafting-checkbox-row input[type=checkbox] { margin-top:3px; flex-shrink:0; width:16px; height:16px; accent-color:#A78BFA; cursor:pointer; }
.crafting-submit:disabled { opacity:.4; cursor:not-allowed; }
/* Crafting submissions panel on teacher dashboard */
.potion-alert { background:rgba(167,139,250,.08); border:1.5px solid rgba(167,139,250,.3); border-radius:12px; padding:14px 16px; margin:0 0 16px; }
.potion-alert-hdr { font-size:14px; font-weight:800; color:#C4B5FD; margin-bottom:10px; }
.potion-req-row { display:flex; align-items:center; gap:10px; padding:6px 0; border-top:1px solid rgba(167,139,250,.15); flex-wrap:wrap; }
.potion-req-name { font-size:13px; font-weight:700; color:#EDE9FE; flex:1; min-width:100px; }
.potion-req-item { font-size:13px; color:#C4B5FD; font-weight:600; }
.potion-req-time { font-size:11px; color:#94A3B8; }
.btn-approve-potion { background:#10B981; color:#fff; border:none; border-radius:8px; padding:5px 12px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; }
.btn-approve-potion:hover { background:#059669; }
.btn-deny-potion { background:transparent; border:1px solid #6B7280; color:#94A3B8; border-radius:8px; padding:5px 10px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; }
.btn-deny-potion:hover { border-color:#EF4444; color:#EF4444; }
/* Grade modal */
.grade-modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:200; display:flex; align-items:center; justify-content:center; padding:16px; }
.grade-modal { background:#1E1B4B; border:2px solid #6D28D9; border-radius:16px; padding:24px 20px 20px; width:100%; max-width:340px; display:flex; flex-direction:column; gap:14px; }
.grade-modal-title { font-family:var(--font-display); font-size:20px; font-weight:900; color:#EDE9FE; text-align:center; }
.grade-modal-sub { color:#C4B5FD; font-size:13px; text-align:center; margin:0; line-height:1.5; }
.grade-modal-input { background:#2D2464; border:1.5px solid #7C3AED; border-radius:10px; color:#EDE9FE; font-size:22px; font-weight:700; padding:10px 14px; outline:none; font-family:inherit; text-align:center; width:100%; box-sizing:border-box; -moz-appearance:textfield; }
.grade-modal-input::-webkit-inner-spin-button,.grade-modal-input::-webkit-outer-spin-button { -webkit-appearance:none; }
.grade-modal-preview { text-align:center; font-size:15px; font-weight:700; color:#94A3B8; letter-spacing:.5px; min-height:20px; }
.grade-modal-btns { display:flex; gap:10px; justify-content:flex-end; }
.grade-reminder-banner { grid-column:1/-1; display:block; width:100%; background:rgba(251,191,36,.15); border:1.5px solid rgba(251,191,36,.55); border-radius:10px; color:#FDE68A; font-size:13px; font-weight:700; text-align:center; padding:10px 16px; cursor:pointer; letter-spacing:.2px; }
.grade-reminder-banner:hover { background:rgba(251,191,36,.25); }
.catchup-list { display:flex; flex-direction:column; gap:8px; overflow-y:auto; flex:1; min-height:0; padding-right:4px; }
.catchup-row { display:flex; align-items:center; justify-content:space-between; gap:12px; background:rgba(255,255,255,.06); border:1px solid rgba(109,40,217,.3); border-radius:10px; padding:10px 12px; }
.catchup-row-info { display:flex; flex-direction:column; gap:2px; min-width:0; }
.catchup-session-label { font-size:13px; font-weight:900; color:#EDE9FE; letter-spacing:.3px; }
.catchup-lesson-name { font-size:11px; color:#C4B5FD; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.btn-purple { background:#7C3AED; color:#fff; border:none; border-radius:10px; padding:10px 18px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
.btn-purple:hover { background:#6D28D9; }
  </style>
