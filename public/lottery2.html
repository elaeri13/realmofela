<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multi-Class Digital Lottery Board</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      background: #f8fafc;
      color: #1e293b;
      margin: 0;
    }
    h1 { margin: 0 0 16px 0; }
    
    .class-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .tab-btn {
      padding: 8px 16px;
      font-size: 15px;
      font-weight: 700;
      border: 2px solid #cbd5e1;
      background: white;
      color: #64748b;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tab-btn.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    button.action-btn {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-draw { background: #16a34a; color: white; }
    .btn-draw:hover { background: #15803d; }
    .btn-reset { background: #e2e8f0; color: #475569; }
    .btn-reset:hover { background: #cbd5e1; }

    .grid {
      display: grid;
      grid-template-columns: repeat(10, 68px);
      gap: 6px;
      background: #e2e8f0;
      padding: 10px;
      border-radius: 12px;
    }
    .tile {
      width: 68px;
      height: 68px;
      background: white;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 4px;
      box-sizing: border-box;
      cursor: pointer;
      user-select: none;
      border: 2px solid transparent;
      transition: transform 0.1s ease, border-color 0.1s ease;
    }
    .tile:hover {
      transform: translateY(-2px);
      border-color: #93c5fd;
    }
    .tile .number {
      font-size: 13px;
      font-weight: 700;
      color: #64748b;
    }
    .tile .initials {
      font-size: 16px;
      font-weight: 800;
      color: #0f172a;
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tile.claimed {
      background: #e0f2fe;
      border-color: #38bdf8;
    }
    .tile.winner {
      background: #fef08a !important;
      border-color: #eab308 !important;
      animation: pulse 0.8s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }
    #winner-banner {
      margin-top: 16px;
      font-size: 18px;
      font-weight: 700;
      color: #15803d;
      min-height: 28px;
    }
  </style>
</head>
<body>

  <h1>Digital Lottery Board</h1>

  <div class="class-tabs">
    <button class="tab-btn active" onclick="switchClass('Class 1')">Class 1</button>
    <button class="tab-btn" onclick="switchClass('Class 2')">Class 2</button>
    <button class="tab-btn" onclick="switchClass('Class 3')">Class 3</button>
    <button class="tab-btn" onclick="switchClass('Class 4')">Class 4</button>
  </div>

  <div class="controls">
    <button class="action-btn btn-draw" onclick="drawWinner()">🎲 Pick Random Winner</button>
    <button class="action-btn btn-reset" onclick="resetBoard()">Reset This Class</button>
  </div>

  <div class="grid" id="grid"></div>
  <div id="winner-banner"></div>

  <script>
    let currentClass = 'Class 1';
    const gridEl = document.getElementById('grid');
    const bannerEl = document.getElementById('winner-banner');

    function getAllData() {
      return JSON.parse(localStorage.getItem('multi_class_lottery') || '{}');
    }

    function getClassData(className) {
      const all = getAllData();
      return all[className] || {};
    }

    function saveClassData(className, data) {
      const all = getAllData();
      all[className] = data;
      localStorage.setItem('multi_class_lottery', JSON.stringify(all));
    }

    function switchClass(className) {
      currentClass = className;
      bannerEl.textContent = '';
      
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent === className);
      });
      
      renderBoard();
    }

    function renderBoard() {
      gridEl.innerHTML = '';
      const classData = getClassData(currentClass);

      for (let i = 1; i <= 100; i++) {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.id = `tile-${i}`;
        
        const num = document.createElement('div');
        num.className = 'number';
        num.textContent = i;
        tile.appendChild(num);

        const initials = document.createElement('div');
        initials.className = 'initials';
        if (classData[i]) {
          initials.textContent = classData[i];
          tile.classList.add('claimed');
        }
        tile.appendChild(initials);

        tile.onclick = () => claimSpot(i);
        gridEl.appendChild(tile);
      }
    }

    function claimSpot(index) {
      const classData = getClassData(currentClass);
      const currentVal = classData[index] || '';
      const name = prompt(`[${currentClass}] Enter initials for Spot #${index}:`, currentVal);
      
      if (name === null) return;

      if (name.trim() === '') {
        delete classData[index];
      } else {
        classData[index] = name.trim().toUpperCase();
      }
      
      saveClassData(currentClass, classData);
      renderBoard();
    }

    function drawWinner() {
      document.querySelectorAll('.tile').forEach(t => t.classList.remove('winner'));
      const winningNumber = Math.floor(Math.random() * 100) + 1;
      const winningTile = document.getElementById(`tile-${winningNumber}`);
      
      if (winningTile) winningTile.classList.add('winner');

      const classData = getClassData(currentClass);
      const owner = classData[winningNumber];
      
      bannerEl.textContent = owner 
        ? `🎉 ${currentClass} Winner: #${winningNumber} (${owner})!` 
        : `🎉 Drawn: #${winningNumber} (Unclaimed)`;
    }

    function resetBoard() {
      if (confirm(`Clear all claimed spots for ${currentClass}?`)) {
        saveClassData(currentClass, {});
        bannerEl.textContent = '';
        renderBoard();
      }
    }

    renderBoard();
  </script>
</body>
</html>
